<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение HTML страниц</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3d3d3d;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent-green: #4CAF50;
            --accent-red: #f44336;
            --accent-blue: #2196F3;
            --border-radius: 4px;
            --spacing-sm: 5px;
            --spacing-md: 10px;
            --spacing-lg: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.4;
            padding: var(--spacing-md);
        }

        .header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: var(--spacing-sm);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .top-menu {
            position: sticky;
            top: 0;
            background-color: var(--bg-secondary);
            padding: var(--spacing-md);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-md);
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            align-items: center;
            justify-content: center;
        }

        .tab-buttons {
            display: flex;
            gap: var(--spacing-sm);
        }

        .nav-buttons {
            display: flex;
            gap: var(--spacing-sm);
        }

        button {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4d4d4d;
        }

        button.active {
            background-color: var(--accent-blue);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .compare-btn {
            background-color: var(--accent-green);
            font-weight: bold;
        }

        .reset-btn {
            background-color: var(--accent-red);
        }

        .content-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .panel {
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            min-height: 300px;
        }

        .panel h2 {
            font-size: 1.2em;
            margin-bottom: var(--spacing-md);
            color: var(--text-secondary);
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .url-input, .file-input {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        input[type="text"], input[type="file"] {
            background-color: var(--bg-tertiary);
            border: 1px solid #555;
            border-radius: var(--border-radius);
            padding: var(--spacing-sm);
            color: var(--text-primary);
            font-size: 0.9em;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .save-btn {
            background-color: var(--accent-green);
            align-self: flex-start;
        }

        .result-area {
            display: none;
            margin-top: var(--spacing-md);
        }

        .diff-container {
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            max-height: 70vh;
            overflow-y: auto;
        }

        .added {
            background-color: rgba(76, 175, 80, 0.2);
            text-decoration: none;
            border-left: 3px solid var(--accent-green);
            padding-left: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
        }

        .removed {
            background-color: rgba(244, 67, 54, 0.2);
            text-decoration: line-through;
            border-left: 3px solid var(--accent-red);
            padding-left: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
        }

        .diff-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: var(--spacing-md);
            padding: var(--spacing-md);
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
        }

        .diff-counter {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .font-size-controls {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            margin-left: auto;
        }

        .font-size-btn {
            background-color: var(--bg-tertiary);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .compact { font-size: 0.8em; }
        .normal { font-size: 1em; }
        .large { font-size: 1.2em; }

        .hidden {
            display: none;
        }

        .current-diff {
            background-color: rgba(33, 150, 243, 0.3);
            border: 1px solid var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Сравнение HTML страниц</h1>
        <p>Инструмент для сравнения версий Steam-гайдов</p>
    </div>

    <div class="top-menu">
        <div class="tab-buttons">
            <button id="tab-new" class="active">Новый</button>
            <button id="tab-old">Старый</button>
            <button id="tab-result">Результат</button>
        </div>
        <div class="nav-buttons">
            <button id="btn-back" disabled>Назад</button>
            <button id="btn-forward" disabled>Вперёд</button>
            <button id="btn-reset" class="reset-btn">Сброс</button>
        </div>
        <div class="font-size-controls">
            <span>Шрифт:</span>
            <button id="font-small" class="font-size-btn">Аа</button>
            <button id="font-normal" class="font-size-btn active">Аа</button>
            <button id="font-large" class="font-size-btn">Аа</button>
        </div>
    </div>

    <div class="content-area">
        <!-- Левая панель - Новый файл -->
        <div class="panel" id="panel-new">
            <h2>Новая версия</h2>
            <div class="input-section">
                <div class="url-input">
                    <label>URL Steam-гайда:</label>
                    <input type="text" id="new-url" placeholder="https://steamcommunity.com/sharedfiles/filedetails/?id=...">
                    <button id="load-new-url">Загрузить URL</button>
                </div>
                <div class="file-input">
                    <label>Или выберите файл:</label>
                    <input type="file" id="new-file" accept=".html,.htm">
                </div>
                <button id="save-new" class="save-btn">Сохранить копию</button>
            </div>
        </div>

        <!-- Правая панель - Старый файл -->
        <div class="panel hidden" id="panel-old">
            <h2>Старая версия</h2>
            <div class="input-section">
                <div class="url-input">
                    <label>URL Steam-гайда:</label>
                    <input type="text" id="old-url" placeholder="https://steamcommunity.com/sharedfiles/filedetails/?id=...">
                    <button id="load-old-url">Загрузить URL</button>
                </div>
                <div class="file-input">
                    <label>Или выберите файл:</label>
                    <input type="file" id="old-file" accept=".html,.htm">
                </div>
            </div>
        </div>
    </div>

    <div class="result-area" id="result-area">
        <button id="btn-compare" class="compare-btn">Сравнить</button>
        
        <div class="diff-navigation">
            <div class="diff-counter" id="diff-counter">Найдено изменений: 0</div>
            <div>
                <button id="btn-prev-diff" disabled>← Назад</button>
                <button id="btn-next-diff" disabled>Вперёд →</button>
            </div>
        </div>

        <div class="diff-container" id="diff-container">
            <!-- Сюда будет вставлен результат сравнения -->
        </div>
    </div>

    <script>
        // Глобальные переменные
        let currentNewContent = '';
        let currentOldContent = '';
        let diffs = [];
        let currentDiffIndex = -1;
        let currentFontSize = 'normal';

        // Элементы DOM
        const tabNew = document.getElementById('tab-new');
        const tabOld = document.getElementById('tab-old');
        const tabResult = document.getElementById('tab-result');
        const panelNew = document.getElementById('panel-new');
        const panelOld = document.getElementById('panel-old');
        const resultArea = document.getElementById('result-area');
        const btnCompare = document.getElementById('btn-compare');
        const btnBack = document.getElementById('btn-back');
        const btnForward = document.getElementById('btn-forward');
        const btnReset = document.getElementById('btn-reset');
        const btnPrevDiff = document.getElementById('btn-prev-diff');
        const btnNextDiff = document.getElementById('btn-next-diff');
        const diffCounter = document.getElementById('diff-counter');
        const diffContainer = document.getElementById('diff-container');
        const newUrlInput = document.getElementById('new-url');
        const oldUrlInput = document.getElementById('old-url');
        const newFileInput = document.getElementById('new-file');
        const oldFileInput = document.getElementById('old-file');
        const loadNewUrlBtn = document.getElementById('load-new-url');
        const loadOldUrlBtn = document.getElementById('load-old-url');
        const saveNewBtn = document.getElementById('save-new');
        const fontSmall = document.getElementById('font-small');
        const fontNormal = document.getElementById('font-normal');
        const fontLarge = document.getElementById('font-large');

        // Управление вкладками
        tabNew.addEventListener('click', () => switchTab('new'));
        tabOld.addEventListener('click', () => switchTab('old'));
        tabResult.addEventListener('click', () => switchTab('result'));

        function switchTab(tab) {
            // Сброс активных состояний
            tabNew.classList.remove('active');
            tabOld.classList.remove('active');
            tabResult.classList.remove('active');
            panelNew.classList.add('hidden');
            panelOld.classList.add('hidden');
            resultArea.style.display = 'none';

            // Активация выбранной вкладки
            switch(tab) {
                case 'new':
                    tabNew.classList.add('active');
                    panelNew.classList.remove('hidden');
                    break;
                case 'old':
                    tabOld.classList.add('active');
                    panelOld.classList.remove('hidden');
                    break;
                case 'result':
                    tabResult.classList.add('active');
                    resultArea.style.display = 'block';
                    break;
            }
        }

        // Загрузка URL
        loadNewUrlBtn.addEventListener('click', () => loadFromUrl('new'));
        loadOldUrlBtn.addEventListener('click', () => loadFromUrl('old'));

        async function loadFromUrl(type) {
            const urlInput = type === 'new' ? newUrlInput : oldUrlInput;
            const url = urlInput.value.trim();
            
            if (!url) {
                alert('Введите URL');
                return;
            }

            try {
                const response = await fetch(url);
                const html = await response.text();
                
                if (type === 'new') {
                    currentNewContent = html;
                    alert('Новая версия загружена успешно!');
                } else {
                    currentOldContent = html;
                    alert('Старая версия загружена успешно!');
                }
                
                updateCompareButtonState();
            } catch (error) {
                alert('Ошибка загрузки: ' + error.message);
            }
        }

        // Загрузка файлов
        newFileInput.addEventListener('change', (e) => handleFileSelect(e, 'new'));
        oldFileInput.addEventListener('change', (e) => handleFileSelect(e, 'old'));

        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                if (type === 'new') {
                    currentNewContent = content;
                } else {
                    currentOldContent = content;
                }
                updateCompareButtonState();
                alert(`Файл "${file.name}" загружен успешно!`);
            };
            reader.readAsText(file);
        }

        // Сохранение копии
        saveNewBtn.addEventListener('click', saveCurrentPage);

        function saveCurrentPage() {
            if (!currentNewContent) {
                alert('Сначала загрузите новую версию');
                return;
            }

            // Парсим title из HTML
            const titleMatch = currentNewContent.match(/<title[^>]*>([^<]+)<\/title>/i);
            const title = titleMatch ? titleMatch[1].trim() : 'steam_guide';
            
            // Форматируем дату
            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}_${String(now.getMonth() + 1).padStart(2, '0')}_${now.getFullYear()}`;
            
            // Создаем имя файла
            const filename = `${dateStr}_${title.replace(/[^a-z0-9]/gi, '_')}.html`;
            
            // Создаем и скачиваем файл
            const blob = new Blob([currentNewContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert(`Файл сохранен как: ${filename}`);
        }

        // Обновление состояния кнопки сравнения
        function updateCompareButtonState() {
            btnCompare.disabled = !(currentNewContent && currentOldContent);
        }

        // Сравнение
        btnCompare.addEventListener('click', compareContents);

        function compareContents() {
            if (!currentNewContent || !currentOldContent) {
                alert('Загрузите обе версии для сравнения');
                return;
            }

            // Простое текстовое сравнение (можно заменить на более сложный алгоритм)
            const newLines = currentNewContent.split('\n').filter(line => line.trim());
            const oldLines = currentOldContent.split('\n').filter(line => line.trim());
            
            diffs = [];
            let i = 0, j = 0;
            
            while (i < newLines.length || j < oldLines.length) {
                if (i < newLines.length && j < oldLines.length && newLines[i] === oldLines[j]) {
                    // Строки идентичны
                    i++;
                    j++;
                } else {
                    // Найдено различие
                    if (j < oldLines.length && (i >= newLines.length || newLines[i] !== oldLines[j])) {
                        // Удаленная строка
                        diffs.push({ type: 'removed', content: oldLines[j], index: j });
                        j++;
                    }
                    if (i < newLines.length && (j >= oldLines.length || newLines[i] !== oldLines[j])) {
                        // Добавленная строка
                        diffs.push({ type: 'added', content: newLines[i], index: i });
                        i++;
                    }
                }
            }

            displayDiffs();
            switchTab('result');
        }

        // Отображение различий
        function displayDiffs() {
            diffContainer.innerHTML = '';
            
            if (diffs.length === 0) {
                diffContainer.innerHTML = '<p>Различий не найдено</p>';
                diffCounter.textContent = 'Найдено изменений: 0';
                btnPrevDiff.disabled = true;
                btnNextDiff.disabled = true;
                return;
            }

            diffCounter.textContent = `Найдено изменений: ${diffs.length}`;
            btnPrevDiff.disabled = false;
            btnNextDiff.disabled = false;
            currentDiffIndex = -1;

            diffs.forEach(diff => {
                const div = document.createElement('div');
                div.className = diff.type;
                div.textContent = diff.content;
                diffContainer.appendChild(div);
            });

            navigateToDiff(0);
        }

        // Навигация по различиям
        btnPrevDiff.addEventListener('click', () => navigateToDiff(currentDiffIndex - 1));
        btnNextDiff.addEventListener('click', () => navigateToDiff(currentDiffIndex + 1));

        function navigateToDiff(index) {
            // Снимаем подсветку с текущего элемента
            const currentElements = document.querySelectorAll('.current-diff');
            currentElements.forEach(el => el.classList.remove('current-diff'));

            if (index >= 0 && index < diffs.length) {
                currentDiffIndex = index;
                const diffElements = document.querySelectorAll(`.${diffs[index].type}`);
                if (diffElements[index]) {
                    diffElements[index].classList.add('current-diff');
                    diffElements[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            btnPrevDiff.disabled = currentDiffIndex <= 0;
            btnNextDiff.disabled = currentDiffIndex >= diffs.length - 1;
        }

        // Управление размером шрифта
        fontSmall.addEventListener('click', () => setFontSize('compact'));
        fontNormal.addEventListener('click', () => setFontSize('normal'));
        fontLarge.addEventListener('click', () => setFontSize('large'));

        function setFontSize(size) {
            document.body.className = '';
            if (size !== 'normal') {
                document.body.classList.add(size);
            }
            
            fontSmall.classList.remove('active');
            fontNormal.classList.remove('active');
            fontLarge.classList.remove('active');
            
            document.getElementById(`font-${size === 'compact' ? 'small' : size === 'large' ? 'large' : 'normal'}`).classList.add('active');
            
            currentFontSize = size;
        }

        // Сброс
        btnReset.addEventListener('click', resetAll);

        function resetAll() {
            currentNewContent = '';
            currentOldContent = '';
            diffs = [];
            currentDiffIndex = -1;
            
            newUrlInput.value = '';
            oldUrlInput.value = '';
            newFileInput.value = '';
            oldFileInput.value = '';
            diffContainer.innerHTML = '';
            
            updateCompareButtonState();
            switchTab('new');
        }

        // Инициализация
        updateCompareButtonState();
    </script>
</body>
</html>
